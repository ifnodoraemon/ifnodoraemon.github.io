<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} — AI 大模型观察</title>
  <meta name="description" content="{{description}}">
  <meta name="keywords" content="{{keywords}}">
  <meta name="author" content="ifnodoraemon">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://ifnodoraemon.github.io/articles/{{slug}}/">
  <meta name="theme-color" content="#06060b">

  <!-- Open Graph / Article -->
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://ifnodoraemon.github.io/articles/{{slug}}/">
  <meta property="og:title" content="{{title}} — AI 大模型观察">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="https://ifnodoraemon.github.io/og-image.png">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:site_name" content="AI 大模型观察">
  <meta property="article:published_time" content="{{isoDate}}">
  <meta property="article:author" content="ifnodoraemon">
  <meta property="article:section" content="{{tag}}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}} — AI 大模型观察">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="https://ifnodoraemon.github.io/og-image.png">

  <!-- Google AdSense -->
  <meta name="google-adsense-account" content="ca-pub-5078775507335151">

  <!-- Assets -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": "{{title}}",
    "description": "{{description}}",
    "datePublished": "{{isoDate}}",
    "dateModified": "{{isoDate}}",
    "author": {
      "@type": "Person",
      "name": "ifnodoraemon",
      "url": "https://github.com/ifnodoraemon"
    },
    "publisher": {
      "@type": "Organization",
      "name": "AI 大模型观察",
      "url": "https://ifnodoraemon.github.io"
    },
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "https://ifnodoraemon.github.io/articles/{{slug}}/"
    },
    "articleSection": "{{tag}}"
  }
  </script>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <canvas id="particles" aria-hidden="true"></canvas>

  <main class="page-main">
    <article class="article-detail">
      <div class="container">
        <div class="article-detail-header fade-in">
          <a href="/articles/" class="back-link">← 返回文章列表</a>
          <div class="card-meta">
            <span class="tag {{tagClass}}">{{tag}}</span>
            <time datetime="{{date}}">{{dateFormatted}}</time>
          </div>
          <h1>{{title}}</h1>
          <p class="article-detail-desc">{{description}}</p>
        </div>
        <div class="article-detail-content fade-in">
          {{content}}
        </div>
        <div class="article-nav fade-in">
          <a href="/articles/" class="btn-ghost">← 返回文章列表</a>
        </div>
      </div>
    </article>
  </main>

  <script type="module" src="/main.js"></script>
</body>
</html>
