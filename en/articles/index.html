<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <canvas id="particles" aria-hidden="true"></canvas>
  <main class="page-main">
    <section class="page-hero">
      <div class="container">
        <div class="page-hero-content fade-in">
          <div class="section-tag">ALL ARTICLES</div>
          <h1>All Articles</h1>
          <p class="page-hero-desc">Discover 1 in-depth articles on AI</p>
        </div>
      </div>
    </section>
    <section class="section section-tight">
      <div class="container">
        <div class="articles-filter fade-in">
          <button class="filter-btn active" data-filter="all">All (1)</button>
          <button class="filter-btn" data-filter="Industry Trends">Industry Trends</button>
        </div>
        <div class="articles-list fade-in">

          <a href="/en/articles/ai-trends-2026/" class="article-list-item article-list-featured" data-tag="Industry Trends">
            <div class="article-list-meta">
              <span class="tag tag-green">Industry Trends</span>
              <span class="article-list-pin">📌 Pinned</span>
              <time datetime="2026-03-07">2026.03.07</time>
            </div>
            <h2>Deep Dive into 6 AI Foundation Model Trends in 2026</h2>
            <p>From Thinking reasoning modes to Agentic applications, a deep dive into the top 6 trends in AI foundation models for 2026.</p>
            
          </a>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const btns = document.querySelectorAll('.filter-btn');
      const items = document.querySelectorAll('.article-list-item');
      btns.forEach(btn => {
        btn.addEventListener('click', () => {
          btns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const filter = btn.dataset.filter;
          items.forEach(item => {
            item.style.display = (filter === 'all' || item.dataset.tag === filter) ? '' : 'none';
          });
        });
      });
    });
  </script>
</body>
