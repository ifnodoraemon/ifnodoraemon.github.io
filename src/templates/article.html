<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} — {{meta.siteName}}</title>
  <meta name="description" content="{{description}}">
  <meta name="keywords" content="{{keywords}}">
  <meta name="author" content="ifnodoraemon">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://ifnodoraemon.github.io{{articles_prefix}}/articles/{{slug}}/">
  <link rel="alternate" hreflang="zh" href="https://ifnodoraemon.github.io/articles/{{slug}}/" />
  <link rel="alternate" hreflang="en" href="https://ifnodoraemon.github.io/en/articles/{{slug}}/" />
  <link rel="alternate" hreflang="x-default" href="https://ifnodoraemon.github.io/articles/{{slug}}/" />
  <meta name="theme-color" content="#06060b">

  <!-- Open Graph / Article -->
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://ifnodoraemon.github.io{{articles_prefix}}/articles/{{slug}}/">
  <meta property="og:title" content="{{title}} — {{meta.siteName}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="{{image}}">
  <meta property="og:locale" content="{{#if isEn}}en_US{{else}}zh_CN{{/if}}">
  <meta property="og:site_name" content="{{meta.siteName}}">
  <meta property="article:published_time" content="{{isoDate}}">
  <meta property="article:author" content="ifnodoraemon">
  <meta property="article:section" content="{{tag}}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}} — {{meta.siteName}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{image}}">

  <!-- Google AdSense -->
  <meta name="google-adsense-account" content="ca-pub-5078775507335151">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4WZN5Q7VS6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-4WZN5Q7VS6');
  </script>

  <!-- Assets -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <link rel="stylesheet" href="/src/assets/css/style.css">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": "{{title}}",
    "description": "{{description}}",
    "datePublished": "{{isoDate}}",
    "dateModified": "{{isoDate}}",
    "image": "{{image}}",
    "author": {
      "@type": "Person",
      "name": "ifnodoraemon",
      "url": "https://github.com/ifnodoraemon"
    },
    "publisher": {
      "@type": "Organization",
      "name": "大雄话AI",
      "url": "https://ifnodoraemon.github.io"
    },
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "https://ifnodoraemon.github.io{{articles_prefix}}/articles/{{slug}}/"
    },
    "articleSection": "{{tag}}"
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "{{meta.siteName}}", "item": "https://ifnodoraemon.github.io{{articles_prefix}}/" },
      { "@type": "ListItem", "position": 2, "name": "{{breadcrumb_articles}}", "item": "https://ifnodoraemon.github.io{{articles_prefix}}/articles/" },
      { "@type": "ListItem", "position": 3, "name": "{{title}}" }
    ]
  }
  </script>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <canvas id="particles" aria-hidden="true"></canvas>

  <nav id="navbar" class="navbar" aria-label="主导航"></nav>

  <main class="page-main">
    <article class="article-detail">
      <div class="container">
        <div class="article-detail-header fade-in">
          <a href="{{articles_link}}" class="back-link">{{return_text}}</a>
          <div class="card-meta">
            <span class="tag {{tagClass}}">{{tag}}</span>
            <time datetime="{{date}}">{{dateFormatted}}</time>
            <span class="meta-divider">•</span>
            <span>{{wordCountText}}</span>
            <span class="meta-divider">•</span>
            <span>{{readingTimeText}}</span>
          </div>
          <h1>{{title}}</h1>
          <p class="article-detail-desc">{{description}}</p>
        </div>
        <div class="article-layout">
          <!-- TOC Sidebar -->
          <aside class="article-sidebar fade-in">
            {{toc}}
          </aside>
          
          <!-- Main Content -->
          <div class="article-detail-content fade-in">
            {{content}}
            
            <!-- Giscus Comments -->
            <div class="giscus-container">
              <script src="https://giscus.app/client.js"
                data-repo="ifnodoraemon/ifnodoraemon.github.io"
                data-repo-id="R_kgDON7u7iA"
                data-category="Announcements"
                data-category-id="DIC_kwDON7u7iM4CnKDE"
                data-mapping="specific"
                data-term="{{slug}}"
                data-strict="0"
                data-reactions-enabled="1"
                data-emit-metadata="0"
                data-input-position="top"
                data-theme="dark"
                data-lang="{{lang}}"
                crossorigin="anonymous"
                async>
              </script>
            </div>
          </div>
        </div>
        {{prevNextHtml}}
        <div class="article-nav fade-in">
          <a href="{{articles_link}}" class="btn-ghost">{{return_text}}</a>
          <div class="share-buttons">
            <span class="share-label" style="font-size: 0.85rem; color: var(--text-muted); margin-right: 0.5rem; font-family: var(--font-mono);">Share:</span>
            <a href="https://twitter.com/intent/tweet?text={{encodedTitle}}&url={{encodedUrl}}" target="_blank" rel="noopener noreferrer" class="btn-ghost share-btn share-x" title="Share to X" aria-label="Share to X">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
              </svg>
            </a>
            <a href="https://www.linkedin.com/sharing/share-offsite/?url={{encodedUrl}}" target="_blank" rel="noopener noreferrer" class="btn-ghost share-btn share-linkedin" title="Share to LinkedIn" aria-label="Share to LinkedIn">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
              </svg>
            </a>
            <a href="https://news.ycombinator.com/submitlink?u={{encodedUrl}}&t={{encodedTitle}}" target="_blank" rel="noopener noreferrer" class="btn-ghost share-btn share-hn" title="Share to Hacker News" aria-label="Share to Hacker News">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M2 2v20h20V2H2zm10.2 11v5h-2.1v-5l-3.3-6.5h2.4l2 4.4 2-4.4h2.3l-3.3 6.5z"/>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </article>
  </main>
  
  <button id="back-to-top" class="back-to-top" aria-label="Back to top">
    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

  <footer id="site-footer" class="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>hljs.highlightAll();</script>
  <script type="module" src="/src/assets/js/main.js"></script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({
      startOnLoad: true,
      theme: 'dark',
      themeVariables: {
        darkMode: true,
        background: '#0a0a1a',
        mainBkg: '#1a1a2e',
        nodeBorder: '#6366f1',
        clusterBkg: 'rgba(99,102,241,0.06)',
        clusterBorder: 'rgba(99,102,241,0.2)',
        titleColor: '#a5b4fc',
        nodeTextColor: '#e2e8f0',
        primaryColor: '#1e1e3a',
        primaryTextColor: '#e2e8f0',
        primaryBorderColor: '#6366f1',
        lineColor: '#818cf8',
        secondaryColor: '#1a1a2e',
        tertiaryColor: '#1a1a2e',
        fontFamily: 'Inter, Noto Sans SC, sans-serif',
        fontSize: '14px',
      }
    });
  </script>
</body>
</html>
